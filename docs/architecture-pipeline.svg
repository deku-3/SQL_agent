<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="aRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f85149"/>
    </marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/>
    </marker>
    <marker id="aAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d29922"/>
    </marker>
  </defs>

  <rect width="1200" height="470" rx="14" fill="#0d1117"/>
  <rect x="1" y="1" width="1198" height="468" rx="13" fill="none" stroke="#21262d" stroke-width="2"/>

  <text x="44" y="50" fill="#e6edf3" font-size="20" font-weight="700">Pipeline</text>
  <text x="44" y="72" fill="#8b949e" font-size="12" letter-spacing="2">GATE → REWRITE → ROUTE → GENERATE → EXECUTE → ANSWER</text>
  <line x1="44" y1="88" x2="1156" y2="88" stroke="#21262d"/>

  <!-- question -->
  <rect x="44" y="176" width="104" height="44" rx="22" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="96" y="203" fill="#e6edf3" font-size="13" font-weight="600" text-anchor="middle">question</text>

  <!-- gate -->
  <rect x="186" y="164" width="132" height="68" rx="10" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="252" y="190" fill="#e6edf3" font-size="13.5" font-weight="600" text-anchor="middle">gate</text>
  <text x="252" y="207" fill="#8b949e" font-size="10.5" text-anchor="middle">length check,</text>
  <text x="252" y="220" fill="#8b949e" font-size="10.5" text-anchor="middle">before any LLM call</text>

  <!-- rewrite -->
  <rect x="356" y="164" width="132" height="68" rx="10" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
  <text x="422" y="190" fill="#e6edf3" font-size="13.5" font-weight="600" text-anchor="middle">rewrite</text>
  <text x="422" y="207" fill="#8b949e" font-size="10.5" text-anchor="middle">resolve pronouns into</text>
  <text x="422" y="220" fill="#8b949e" font-size="10.5" text-anchor="middle">a standalone question</text>

  <!-- retrieve -->
  <rect x="526" y="164" width="132" height="68" rx="10" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
  <text x="592" y="190" fill="#e6edf3" font-size="13.5" font-weight="600" text-anchor="middle">retrieve</text>
  <text x="592" y="207" fill="#8b949e" font-size="10.5" text-anchor="middle">topic-shift check,</text>
  <text x="592" y="220" fill="#8b949e" font-size="10.5" text-anchor="middle">then top-k candidates</text>

  <!-- pick_db -->
  <rect x="696" y="164" width="132" height="68" rx="10" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
  <text x="762" y="190" fill="#e6edf3" font-size="13.5" font-weight="600" text-anchor="middle">pick_db</text>
  <text x="762" y="207" fill="#8b949e" font-size="10.5" text-anchor="middle">LLM judge over</text>
  <text x="762" y="220" fill="#8b949e" font-size="10.5" text-anchor="middle">candidate schemas</text>

  <!-- write_query -->
  <rect x="866" y="164" width="132" height="68" rx="10" fill="#1c2128" stroke="#a371f7" stroke-width="1.5"/>
  <text x="932" y="190" fill="#e6edf3" font-size="13.5" font-weight="600" text-anchor="middle">write_query</text>
  <text x="932" y="207" fill="#8b949e" font-size="10.5" text-anchor="middle">schema + few-shot,</text>
  <text x="932" y="220" fill="#8b949e" font-size="10.5" text-anchor="middle">structured SQL out</text>

  <!-- execute -->
  <rect x="1024" y="164" width="132" height="68" rx="10" fill="#1c2128" stroke="#d29922" stroke-width="1.6"/>
  <text x="1090" y="190" fill="#e6edf3" font-size="13.5" font-weight="600" text-anchor="middle">execute_query</text>
  <text x="1090" y="207" fill="#8b949e" font-size="10.5" text-anchor="middle">safety gate, run SQL,</text>
  <text x="1090" y="220" fill="#8b949e" font-size="10.5" text-anchor="middle">inspect the outcome</text>

  <!-- arrows across -->
  <line x1="148" y1="198" x2="182" y2="198" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="318" y1="198" x2="352" y2="198" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="488" y1="198" x2="522" y2="198" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="658" y1="198" x2="692" y2="198" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="828" y1="198" x2="862" y2="198" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="998" y1="198" x2="1020" y2="198" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- gate reject -->
  <path d="M 252 164 C 252 120 200 120 160 120" fill="none" stroke="#f85149" stroke-width="1.5" marker-end="url(#aRed)"/>
  <text x="262" y="136" fill="#f85149" font-size="10.5">too long → reject</text>
  <rect x="72" y="102" width="84" height="34" rx="17" fill="#161b22" stroke="#30363d" stroke-width="1.3"/>
  <text x="114" y="124" fill="#e6edf3" font-size="12" font-weight="600" text-anchor="middle">END</text>

  <!-- three outcomes from execute -->
  <path d="M 1090 232 C 1090 280 1090 300 1090 316" fill="none" stroke="#8b949e" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="900" y="316" width="256" height="44" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
  <text x="1028" y="335" fill="#e6edf3" font-size="12" font-weight="600" text-anchor="middle">route_after_execute</text>
  <text x="1028" y="351" fill="#8b949e" font-size="10.5" text-anchor="middle">three recovery paths — see diagram 2</text>

  <!-- ok -> answer -->
  <path d="M 900 338 C 700 338 560 338 500 338" fill="none" stroke="#3fb950" stroke-width="1.7" marker-end="url(#aGreen)"/>
  <text x="700" y="330" fill="#3fb950" font-size="11" font-weight="600" text-anchor="middle">result ok</text>

  <!-- answer -->
  <rect x="356" y="312" width="140" height="56" rx="10" fill="#12261a" stroke="#3fb950" stroke-width="1.6"/>
  <text x="426" y="334" fill="#e6edf3" font-size="13.5" font-weight="600" text-anchor="middle">answer</text>
  <text x="426" y="352" fill="#8b949e" font-size="10.5" text-anchor="middle">states the actual values</text>

  <!-- answer -> END -->
  <line x1="352" y1="340" x2="298" y2="340" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="212" y="322" width="84" height="36" rx="18" fill="#161b22" stroke="#30363d" stroke-width="1.3"/>
  <text x="254" y="345" fill="#e6edf3" font-size="12" font-weight="600" text-anchor="middle">END</text>

  <!-- loops hint -->
  <path d="M 990 360 C 960 400 940 404 932 404" fill="none" stroke="#d29922" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#aAmber)"/>
  <text x="880" y="420" fill="#d29922" font-size="10.5" text-anchor="middle">retry / re-route / give_up</text>

  <text x="44" y="446" fill="#484f58" font-size="10.5">red = pre-LLM rejection · blue = routing · purple = generation · amber = execution and recovery · green = success path</text>
</svg>
